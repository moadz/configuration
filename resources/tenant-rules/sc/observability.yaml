apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhobs-sc-observability-rules
  annotations:
    description: "Template for deploying SC observability health rules to RHOBS"
parameters:
  - name: NAMESPACE
    description: Namespace to deploy the rules to
    required: true
  - name: TENANT
    description: Tenant to deploy the rules to
    required: true
objects:
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sc-watchdog
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sc-watchdog
          interval: 60s
          rules:
            - record: watchdog
              expr: group by (_id)(kube_node_labels)
            - alert: DeadMansSnitch
              annotations:
                description: >
                  This is an alert meant to ensure that the entire alerting pipeline is functional.
                  This alert is always firing, therefore it should always be firing in Alertmanager
                  and always fire against a receiver.
              expr: watchdog
              labels:
                severity: critical
