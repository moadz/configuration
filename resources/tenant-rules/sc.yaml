# ============================================================================
# WARNING: This file is auto-generated from resources/tenant-rules/sc/*.yaml
# DO NOT EDIT THIS FILE DIRECTLY!
#
# To modify SC tenant rules:
#   1. Edit the appropriate file in resources/tenant-rules/sc/
#   2. Run: make sc-rules
#   3. Commit both the source file and this generated file
#
# Source files:
#   - sc/acm-managed-clusters.yaml  (ACM managed cluster condition alerts)
#   - sc/acm-grc.yaml              (ACM GRC policy controller alerts)
#   - sc/acm-manifestwork.yaml     (ACM ManifestWork failure alerts)
#   - sc/cert-manager.yaml         (TLS certificate health alerts)
#   - sc/observability.yaml        (DeadMansSnitch watchdog)
# ============================================================================
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhobs-sc-rules
  annotations:
    description: Template for deploying SC rules to RHOBS
parameters:
  - name: NAMESPACE
    description: Namespace to deploy the rules to
    required: true
  - name: TENANT
    description: Tenant to deploy the rules to
    required: true
objects:
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sre-acm-managed-cluster-alerts
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sre-acm-managed-cluster-alerts
          interval: 60s
          rules:
            - alert: ACMManagedClusterConditionUnknown
              annotations:
                description: Managed cluster {{ $labels.managed_cluster_name }} availability status has been unknown for 10 minutes. This may indicate connectivity issues between ACM hub and the managed cluster, or agent issues.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/acm/ACMManagedClusterConditionUnknown.md
                summary: Managed cluster {{ $labels.managed_cluster_name }} condition is unknown
              expr: |
                max by (managed_cluster_name, managed_cluster_id) (
                  acm_managed_cluster_status_condition{condition="ManagedClusterConditionAvailable", status="unknown"} == 1
                )
              for: 10m
              labels:
                severity: warning
                otel_collect: "true"
            - alert: ACMManagedClusterKubeAPIServerUnavailable
              annotations:
                description: The managed cluster kube-apiserver has been unreachable from the service cluster for 15 minutes. This may indicate network issues, API server failure, or certificate problems.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/acm/ACMManagedClusterKubeAPIServerUnavailable.md
                summary: Managed cluster {{ $labels.managed_cluster_name }} kube-apiserver is unreachable.
              expr: |
                acm_managed_cluster_status_condition{condition="ManagedClusterConditionAvailable",status="false"} == 1
              for: 15m
              labels:
                severity: warning
                otel_collect: "true"
            - alert: ACMManagedClusterClientCertRotationFailed
              annotations:
                description: Managed cluster {{ $labels.managed_cluster_name }} client certificate has failed to rotate for 12+ hours. This indicates the registration-agent cannot renew the client certificate, which may lead to cluster disconnection.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/acm/ACMManagedClusterClientCertRotationFailed.md
                summary: Managed cluster {{ $labels.managed_cluster_name }} certificate rotation failed
              expr: |
                max by (managed_cluster_name, managed_cluster_id) (
                  acm_managed_cluster_status_condition{condition="ClusterCertificateRotated", status="false"} == 1
                )
              for: 12h
              labels:
                severity: warning
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sre-acm-grc-policy-controller-alerts
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sre-acm-grc-policy-controller-alerts
          interval: 60s
          rules:
            - alert: ACMPolicyControllerReconcileErrors
              annotations:
                description: Policy controller {{ $labels.controller }} has {{ $value | humanizePercentage }} reconciliation error rate over 15 minutes.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/acm/ACMPolicyControllerReconcileErrors.md
                summary: Policy controller {{ $labels.controller }} has high error rate
              expr: |
                max by (controller) (
                  increase(controller_runtime_reconcile_total{
                    controller=~"policy-encryption-keys|policy-propagator|policy-set|policy-spec-sync|policy-status-sync|policy-template-sync|root-policy-status"
                  }[15m])
                ) >= 5
                and on(controller) (
                  max by (controller) (
                    increase(controller_runtime_reconcile_errors_total{
                      controller=~"policy-encryption-keys|policy-propagator|policy-set|policy-spec-sync|policy-status-sync|policy-template-sync|root-policy-status"
                    }[15m])
                  )
                  /
                  max by (controller) (
                    increase(controller_runtime_reconcile_total{
                      controller=~"policy-encryption-keys|policy-propagator|policy-set|policy-spec-sync|policy-status-sync|policy-template-sync|root-policy-status"
                    }[15m])
                  )
                ) > 0.50
              for: 5m
              labels:
                severity: warning
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sre-acm-manifestwork-alerts
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sre-acm-manifestwork-alerts
          interval: 1m
          rules:
            - alert: ACMManifestWorkAppliedHighFailureRate
              annotations:
                description: '{{ $value | humanizePercentage }} of ManifestWorks are failing to apply, indicating a widespread issue affecting ACM operations.'
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/acm/ACMManifestWorkAppliedHighFailureRate.md
                summary: 'High ManifestWork failure rate: {{ $value | humanizePercentage }}'
              expr: |
                sre_acm_manifestwork_applied_failed_ratio > 0.10
              for: 5m
              labels:
                severity: warning
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sc-cert-manager
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sc-cert-manager
          interval: 60s
          rules:
            - alert: CertManagerCertExpirySoon
              annotations:
                description: Ingress TLS certificate for Hosted Control Plane is expiring soon. The HCP Ingress endpoint will become unavailable after {{ $value | humanizeDuration }}.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/cert-manager/CertManagerCertExpirySoon.md
                summary: The cert {{ $labels.name }} is {{ $value | humanizeDuration }} from expiry.
              expr: |
                (
                  avg by (exported_namespace, namespace, name) (
                    certmanager_certificate_expiration_timestamp_seconds - time()
                  ) < (21 * 24 * 3600)
                )
                and
                (
                  avg by (exported_namespace, namespace, name) (
                    certmanager_certificate_expiration_timestamp_seconds - time()
                  ) > 0
                )
              for: 1h
              labels:
                severity: warning
                otel_collect: "true"
            - alert: CertManagerCertNotReady
              annotations:
                description: Ingress TLS certificate for Hosted Control Plane has not been ready for at least 10 minutes. This may indicate Let's Encrypt issuance issues or DNS-01 challenge failures.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/cert-manager/CertManagerCertNotReady.md
                summary: The cert {{ $labels.name }} is not ready to serve traffic.
              expr: |
                max by (name, exported_namespace, namespace, condition) (
                  certmanager_certificate_ready_status{condition!="True"} == 1
                )
              for: 10m
              labels:
                severity: warning
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sc-watchdog
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sc-watchdog
          interval: 60s
          rules:
            - record: watchdog
              expr: group by (_id)(kube_node_labels)
            - alert: SCWatchdog
              annotations:
                description: |
                  Always-firing watchdog alert for the SC alerting pipeline. If this alert stops firing, the pipeline is broken.
              expr: watchdog
              labels:
                severity: none
