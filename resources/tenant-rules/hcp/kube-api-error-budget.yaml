apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhobs-hcp-kube-api-error-budget-rules
  annotations:
    description: "Template for deploying KubeAPI error budget burn SLO rules to RHOBS"
parameters:
  - name: NAMESPACE
    description: Namespace to deploy the rules to
    required: true
  - name: TENANT
    description: Tenant to deploy the rules to
    required: true
objects:
  # SLO based alerting for Kube API server targeting 99.99% availability.
  # Ported from dynatrace-config KubeAPIErrorBudgetBurn.yaml.
  # Two rule groups with different eval intervals:
  #   - 1m eval: base counters, short-window rates (5m-6h), fast/medium burn alerts
  #   - 15m eval: long-window rates (1d, 3d), slow burn alerts
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: kube-api-error-budget-burn-slo
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: KubeAPIErrorBudgetBurn_1m_eval
          interval: 1m
          rules:
            # Base counters -- aggregate raw apiserver metrics by _id
            - record: apiserver_request:read:total_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job,_id,namespace, service, component) (apiserver_request_total{verb=~"LIST|GET", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"})
            - record: apiserver_request:read:errors_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job,_id,namespace, service, component, verb, code) (apiserver_request_total{verb=~"LIST|GET", code=~"5..", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"})
            - record: apiserver_request:read:slow_resource_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job, _id, verb, subresource, resource, namespace) ((
                  apiserver_request_duration_seconds_count {verb=~"LIST|GET", subresource!~"proxy|log|exec", scope="resource",         namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}
                  - ignoring (le)
                  apiserver_request_duration_seconds_bucket{verb=~"LIST|GET", subresource!~"proxy|log|exec", scope="resource", le="1", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}) >= 0) > 0
            - record: apiserver_request:read:slow_namespace_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job, _id, verb, namespace) ((
                  apiserver_request_duration_seconds_count {verb=~"LIST|GET", scope="namespace",         namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}
                  - ignoring (le)
                  apiserver_request_duration_seconds_bucket{verb=~"LIST|GET", scope="namespace", le="5", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}) >= 0)
            - record: apiserver_request:read:slow_cluster_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job, _id, namespace) ((
                  apiserver_request_duration_seconds_count {verb=~"LIST|GET", scope="cluster",          namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}
                  - ignoring (le)
                  apiserver_request_duration_seconds_bucket{verb=~"LIST|GET", scope="cluster", le="20", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}) >= 0)
            - record: apiserver_request:write:total_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job, _id, namespace) (apiserver_request_total{verb=~"POST|PUT|PATCH|DELETE", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"})
            - record: apiserver_request:write:errors_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job,_id,namespace) (apiserver_request_total{verb=~"POST|PUT|PATCH|DELETE", code=~"5..", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"})
            - record: apiserver_request:write:slow_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job, _id, namespace) ((
                  apiserver_request_duration_seconds_count {verb=~"POST|PUT|PATCH|DELETE", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}
                  - ignoring (le)
                  apiserver_request_duration_seconds_bucket{verb=~"POST|PUT|PATCH|DELETE", le="1", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}) >= 0)
            # Error rates -- read (5m, 30m, 1h, 2h, 6h windows)
            - record: apiserver_request:error_rate_5m
              labels:
                verb: read
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[5m])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[5m])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[5m])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[5m])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_30m
              labels:
                verb: read
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[30m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[30m])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[30m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[30m])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[30m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[30m])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[30m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[30m])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_1h
              labels:
                verb: read
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1h])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1h])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1h])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1h])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_2h
              labels:
                verb: read
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[2h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[2h])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[2h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[2h])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[2h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[2h])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[2h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[2h])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_6h
              labels:
                verb: read
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[6h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[6h])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[6h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[6h])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[6h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[6h])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[6h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[6h])), "type", "slow-cluster", "_none_", "")
            # Error rates -- write (5m, 30m, 1h, 2h, 6h windows)
            - record: apiserver_request:error_rate_5m
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[5m])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[5m])), "type", "slow", "_none_", "")
            - record: apiserver_request:error_rate_30m
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[30m])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[30m])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[30m])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[30m])), "type", "slow", "_none_", "")
            - record: apiserver_request:error_rate_1h
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[1h])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[1h])), "type", "slow", "_none_", "")
            - record: apiserver_request:error_rate_2h
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[2h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[2h])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[2h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[2h])), "type", "slow", "_none_", "")
            - record: apiserver_request:error_rate_6h
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[6h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[6h])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[6h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[6h])), "type", "slow", "_none_", "")
            # Alerts -- fast and medium burn
            - alert: KubeAPIErrorBudgetBurn
              annotations:
                description: The API server is burning too much error budget. Too many requests are failing with high latency.
                runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-kube-apiserver-operator/KubeAPIErrorBudgetBurn.md
                summary: High error budget burn for Kube API server
              labels:
                long: 1h
                short: 5m
                severity: warning
                otel_collect: "true"
              expr: |
                max_over_time(count by (_id, job, namespace,type,verb)(apiserver_request:error_rate_1h > (14.40 * 0.0001) and apiserver_request:error_rate_5m > (14.40 * 0.0001))[5m:])
              for: 2m
            - alert: KubeAPIErrorBudgetBurn
              annotations:
                description: The API server is burning too much error budget. Too many requests are failing with high latency.
                runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-kube-apiserver-operator/KubeAPIErrorBudgetBurn.md
                summary: High error budget burn for Kube API server
              labels:
                long: 6h
                short: 30m
                severity: warning
                otel_collect: "true"
              expr: |
                max_over_time(count by (_id, job, namespace,type,verb)(apiserver_request:error_rate_6h > (6.00 * 0.0001) and apiserver_request:error_rate_30m > (6.00 * 0.0001))[10m:])
              for: 15m
        # Long-window error rates and slow burn alerts (15m eval interval)
        - name: KubeAPIErrorBudgetBurn_15m_eval
          interval: 15m
          rules:
            - record: apiserver_request:error_rate_1d
              labels:
                verb: read
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1d])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1d])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1d])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1d])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_3d
              labels:
                verb: read
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[3d])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[3d])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[3d])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[3d])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_1d
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[1d])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[1d])), "type", "slow", "_none_", "")
            - record: apiserver_request:error_rate_3d
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[3d])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[3d])), "type", "slow", "_none_", "")
            # Alerts -- slow and very slow burn
            - alert: KubeAPIErrorBudgetBurn
              annotations:
                description: The API server is burning too much error budget. Too many requests are failing with high latency.
                runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-kube-apiserver-operator/KubeAPIErrorBudgetBurn.md
                summary: High error budget burn for Kube API server
              labels:
                long: 1d
                short: 2h
                severity: warning
                otel_collect: "true"
              expr: |
                apiserver_request:error_rate_1d > (3.00 * 0.0001)
                and
                apiserver_request:error_rate_2h > (3.00 * 0.0001)
              for: 15m
            - alert: KubeAPIErrorBudgetBurn
              annotations:
                description: The API server is burning too much error budget. Too many requests are failing with high latency.
                runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-kube-apiserver-operator/KubeAPIErrorBudgetBurn.md
                summary: High error budget burn for Kube API server
              labels:
                long: 3d
                short: 6h
                severity: warning
                otel_collect: "true"
              expr: |
                apiserver_request:error_rate_3d > (1.00 * 0.0001)
                and
                apiserver_request:error_rate_6h > (1.00 * 0.0001)
              for: 15m
