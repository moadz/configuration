                    "_id_or_ns", "", "_id_or_ns", ".*")
              labels:
                namespace: openshift-route-monitor-operator
                severity: critical
                short_window: 3m
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sre-kube-apiserver-restarts
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: kube-apiserver-restarts
          interval: 60s
          rules:
            - record: sre:kube_apiserver:container_restarts_total
              expr: |
                sum by (namespace, _id) (
                  label_replace(
                    kube_pod_container_status_restarts_total{pod=~"kube-apiserver-.*",namespace=~"ocm-.*-.*"},
                    "exported_namespace",
                    "$1-$2",
                    "namespace",
                    "(ocm-[^-]+)-([^-]+)-.*"
                    )
                * on (exported_namespace) group_left (_id)
                  (max by (exported_namespace, _id) (hypershift_cluster_vcpus) * 0 + 1)
                )
            - alert: KubeAPIServerRestartingFrequently
              annotations:
                description: KubeAPIServer pods in the HCP namespace have restarted 3 or more times in the past 30 minutes.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/KubeAPIServerRestartingFrequently.md
                summary: KubeAPIServer pods are restarting frequently in the HCP namespace.
              expr: |
                (increase(sre:kube_apiserver:container_restarts_total[30m]) >= 3)
                and on(_id)
                (
                  sre:kube_apiserver:container_restarts_total > sre:kube_apiserver:container_restarts_total offset 1h
                )
              for: 2m
              labels:
                severity: critical
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sre-kube-apiserver-rules
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: osd-kube-apiserver-rules
          interval: 1m
          rules:
            - alert: KubeAPIServerDown
              annotations:
                description: The KubeAPIServer pods in the HCP Namespace are not ready, blocking all cluster operations.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/KubeAPIServerDown.md
                summary: No ready KubeAPIServer pods in the HCP namespace.
              labels:
                severity: critical
                otel_collect: "true"
              expr: (sre:kube_apiserver:pod_status_ready == 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 15m
            - alert: KubeAPIServerDegraded
              annotations:
                description: A KubeAPIServer deployment in the HCP namespace has unavailable replicas, risking reduced capacity or latency.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/KubeAPIServerDegraded.md
                summary: Unavailable replicas in KubeAPIServer deployment in the HCP namespace.
              expr: |
                (sre:kube_apiserver:deployment_pods_unavailable > 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 15m
              labels:
                severity: warning
                otel_collect: "true"
            - alert: OpenshiftAPIServerDown
              annotations:
                description: The OpenShiftAPIServer pods in the HCP Namespace are not ready, blocking openshift-specific operations to be blocked.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/OpenshiftAPIServerDown.md
                summary: No ready OpenShiftAPIServer pods in the HCP namespace.
              labels:
                severity: critical
                otel_collect: "true"
              expr: (sre:openshift_apiserver:pod_status_ready == 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 15m
            - alert: OpenshiftAPIServerDegraded
              annotations:
                description: An OpenShiftAPIServer deployment in the HCP namespace has unavailable replicas, risking reduced capacity or latency.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/OpenshiftAPIServerDegraded.md
                summary: Unavailable replicas in OpenShiftAPIServer deployment in the HCP namespace.
              expr: |
                (sre:openshift_apiserver:deployment_pods_unavailable > 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 15m
              labels:
                severity: warning
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: kube-api-error-budget-burn-slo
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: KubeAPIErrorBudgetBurn_1m_eval
          interval: 1m
          rules:
            - record: apiserver_request:read:total_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job,_id,namespace, service, component) (apiserver_request_total{verb=~"LIST|GET", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"})
            - record: apiserver_request:read:errors_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job,_id,namespace, service, component, verb, code) (apiserver_request_total{verb=~"LIST|GET", code=~"5..", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"})
            - record: apiserver_request:read:slow_resource_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job, _id, verb, subresource, resource, namespace) ((
                  apiserver_request_duration_seconds_count {verb=~"LIST|GET", subresource!~"proxy|log|exec", scope="resource",         namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}
                  - ignoring (le)
                  apiserver_request_duration_seconds_bucket{verb=~"LIST|GET", subresource!~"proxy|log|exec", scope="resource", le="1", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}) >= 0) > 0
            - record: apiserver_request:read:slow_namespace_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job, _id, verb, namespace) ((
                  apiserver_request_duration_seconds_count {verb=~"LIST|GET", scope="namespace",         namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}
                  - ignoring (le)
                  apiserver_request_duration_seconds_bucket{verb=~"LIST|GET", scope="namespace", le="5", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}) >= 0)
            - record: apiserver_request:read:slow_cluster_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job, _id, namespace) ((
                  apiserver_request_duration_seconds_count {verb=~"LIST|GET", scope="cluster",          namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}
                  - ignoring (le)
                  apiserver_request_duration_seconds_bucket{verb=~"LIST|GET", scope="cluster", le="20", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}) >= 0)
            - record: apiserver_request:write:total_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job, _id, namespace) (apiserver_request_total{verb=~"POST|PUT|PATCH|DELETE", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"})
            - record: apiserver_request:write:errors_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job,_id,namespace) (apiserver_request_total{verb=~"POST|PUT|PATCH|DELETE", code=~"5..", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"})
            - record: apiserver_request:write:slow_count
              labels:
                otel_collect: "true"
              expr: |
                sum by (job, _id, namespace) ((
                  apiserver_request_duration_seconds_count {verb=~"POST|PUT|PATCH|DELETE", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}
                  - ignoring (le)
                  apiserver_request_duration_seconds_bucket{verb=~"POST|PUT|PATCH|DELETE", le="1", namespace=~"ocm-.*", service="kube-apiserver", component="apiserver"}) >= 0)
            - record: apiserver_request:error_rate_5m
              labels:
                verb: read
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[5m])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[5m])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[5m])), "type", "slow-namespace", "_none_", "")
