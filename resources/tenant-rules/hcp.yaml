# ============================================================================
# WARNING: This file is auto-generated from resources/tenant-rules/hcp/*.yaml
# DO NOT EDIT THIS FILE DIRECTLY!
#
# To modify HCP tenant rules:
#   1. Edit the appropriate file in resources/tenant-rules/hcp/
#   2. Run: make hcp-rules
#   3. Commit both the source file and this generated file
#
# Source files:
#   - hcp/api-server.yaml      (kube-apiserver, openshift-apiserver, SLOs)
#   - hcp/audit.yaml           (audit webhook CloudWatch)
#   - hcp/billing.yaml         (billing metrics)
#   - hcp/cert-manager.yaml    (TLS certificate health)
#   - hcp/cluster-operators.yaml (ClusterOperator health)
#   - hcp/kube-api-error-budget.yaml (KubeAPI SLO error budget burn)
#   - hcp/control-plane.yaml   (etcd, kube-controller-manager, kube-scheduler)
#   - hcp/nodes.yaml           (node health, nodepool, autoscaler)
#   - hcp/oauth.yaml           (OAuth service health)
#   - hcp/observability.yaml   (watchdog, prometheus targets)
#   - hcp/splunk.yaml          (SAE deployment)
#   - hcp/synthetics.yaml      (synthetic monitoring component health)
# ============================================================================
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhobs-hcp-rules
  annotations:
    description: Template for deploying HCP rules to RHOBS
parameters:
  - name: NAMESPACE
    description: Namespace to deploy the rules to
    required: true
  - name: TENANT
    description: Tenant to deploy the rules to
    required: true
objects:
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: audit-webhook-error
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: AuditWebhookCloudWatchErrors
          interval: 60s
          rules:
            - alert: AuditWebhookIncorrectCloudwatchConfiguration
              annotations:
                description: The audit webhook cloudwatch configuration for {{ $labels.namespace }} has been invalid for 5 minutes.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/howto/customer-cw-audit-forwarding-for-hcp.md
                summary: Audit webhook cloudwatch configuration invalid
              expr: (sum by (region, env, _mc_id, namespace, _id) (splunkforwarder_audit_filter_cloudwatch_configuration_invalid{}) > 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 5m
              labels:
                severity: warning
                otel_collect: "true"
            - alert: AuditWebhookCloudWatchErrors
              annotations:
                description: The audit webhook cloudwatch integration for {{ $labels.namespace }} is experiencing problems.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/AuditWebhookCloudWatchErrors.md
                summary: Audit webhook cloudwatch error
              expr: |
                (
                  (sum(splunkforwarder_audit_filter_cloudwatch_enabled) by (_id, _mc_id, namespace, region, env))
                  * on (_id, _mc_id, namespace, region, env)
                  (sum(rate(splunkforwarder_audit_filter_cloudwatch_errors_total[10m])) by (_id, _mc_id, namespace, region, env)) > 0
                ) unless on (_id) hypershift_cluster_alerts_disabled
              for: 10m
              labels:
                severity: warning
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: billing-rules
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: BillingRules
          interval: 30s
          rules:
            - alert: BillingMetricMissing
              annotations:
                description: Recording rule hostedcluster:hypershift_cluster_vcpus:max is not defined for cluster {{ $labels._id }}.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/hypershift/BillingMetricMissing.md
                summary: Recording rule used for the billing is not defined
              expr: |
                (hypershift_cluster_vcpus_computation_error or (hypershift_cluster_silence_alerts unless on(_id, _mc_id) hostedcluster:hypershift_cluster_vcpus:max))
                unless on (_id) hypershift_cluster_alerts_disabled
              for: 30m
              labels:
                severity: critical
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: cert-manager
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: cert-manager
          interval: 60s
          rules:
            - alert: CertManagerCertExpirySoon
              annotations:
                description: Kubernetes API TLS certificate for Hosted Control Plane is expiring soon. The HCP API endpoint will become unavailable after {{ $value | humanizeDuration }}.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/cert-manager/CertManagerCertExpirySoon.md
                summary: The cert {{ $labels.name }} is {{ $value | humanizeDuration }} from expiry.
              expr: |
                (
                  avg by (exported_namespace, namespace, name, _id) (
                    certmanager_certificate_expiration_timestamp_seconds - time()
                  ) < (21 * 24 * 3600)
                )
                and
                (
                  avg by (exported_namespace, namespace, name, _id) (
                    certmanager_certificate_expiration_timestamp_seconds - time()
                  ) > 0
                )
              for: 1h
              labels:
                severity: warning
                otel_collect: "true"
            - alert: CertManagerCertNotReady
              annotations:
                description: Kubernetes API TLS certificate for Hosted Control Plane has not been ready for at least 10 minutes. This may indicate Let's Encrypt issuance issues or DNS-01 challenge failures.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/cert-manager/CertManagerCertNotReady.md
                summary: The cert {{ $labels.name }} is not ready to serve traffic.
              expr: |
                max by (name, exported_namespace, namespace, condition, _id) (
                  certmanager_certificate_ready_status{condition!="True"} == 1
                )
              for: 10m
              labels:
                severity: warning
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: nodepool-failure
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: NodePoolFailing
          interval: 1m
          rules:
            - alert: NodePoolFailing
              expr: (hypershift_nodepools:replicas_failure > 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 15m
              labels:
                severity: warning
              annotations:
                message: '{{ $labels.nodepool_name }} nodepool on {{ $labels._id }} is not creating nodes'
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/NodePoolFailing.md
                summary: NodePool is not creating nodes
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: nodes-need-upscale
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: NodesNeedUpscale
          interval: 1m
          rules:
            - alert: NodesNeedUpscale
              expr: (hypershift_cluster:expected_total_nodes{replicas_failure_all_nodepools="0"} > hypershift_cluster:current_ready_nodes{replicas_failure_all_nodepools="0"} + 1) unless on (_id) hypershift_cluster_alerts_disabled
              for: 60m
              labels:
                severity: warning
              annotations:
                message: HCP cluster {{ $labels._id }} is short on nodes
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/NodesNeedUpscale.md
                summary: Nodes need upscaling
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: cluster-autoscaler-rules
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: cluster-autoscaler.rules
          interval: 1m
          rules:
            - alert: ClusterAutoscalerDown
              annotations:
                description: There are 0 Ready 'cluster-autoscaler' Pods for {{ $labels.namespace }}.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/ClusterAutoscalerAlert.md
                summary: No Ready cluster-autoscaler pods.
              labels:
                severity: critical
              expr: (cluster_autoscaler:pod_status_ready == 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 15m
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: nodes-rules
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: NodesRules
          interval: 30s
          rules:
            - alert: NodeHighResourceUsage
              expr: hypershift_node:high_usage unless on (_id) hypershift_cluster_alerts_disabled
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: High {{ $labels.resource }} usage on node {{ $labels.node }}
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/hypershift/NodeHighResourceUsage.md
                description: 'Node {{ $labels.node }} has {{ $labels.resource }} usage above {{ $labels.threshold }} (current value: {{ $value | humanizePercentage }}) for more than 30 minutes.'
            - alert: NodeNotReady
              expr: (hypershift_node:ready == 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: Node {{ $labels.node }} is not ready
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/hypershift/NodeNotReady.md
                description: Node {{ $labels.node }} has not been ready for more than 30 minutes.
            - alert: NodeInBadCondition
              expr: (hypershift_node:in_bad_condition == 1) unless on (_id) hypershift_cluster_alerts_disabled
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: Node {{ $labels.node }} is in bad condition
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/hypershift/NodeInBadCondition.md
                description: Condition {{ $labels.condition }} has been triggering on node {{ $labels.node }} for more than 30 minutes.
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sre-node-not-joining-nodepool-sre-actionable-rules
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sre-NodepoolFailureSRE
          interval: 30s
          rules:
            - alert: NodepoolFailureSRE
              annotations:
                description: One or more nodepool from the cluster are having issue while adding node(s)
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/hypershift/NodepoolFailureSRE.md
                summary: HCP Cluster nodepool having issues while adding nodes
              expr: (sre:nodepool:provisioning_failure_notify and on (exported_namespace, _mc_id) (sre:nodepool:all_components_available==0 or sre:nodepool:invalid_payload_nodepool_provision_failure)) unless on (_id) hypershift_cluster_alerts_disabled
              for: 1h
              labels:
                otel_collect: "true"
                severity: warning
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sre-nodes-need-upscale-rules
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sre-RequestServingNodesNeedUpscale
          interval: 30s
          rules:
            - alert: RequestServingNodesNeedUpscale
              annotations:
                description: The cluster's request serving nodes have been undersized for 1 hour and need to be assigned to a bigger request serving node pair.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/RequestServingNodesNeedUpscale.md
                summary: HCP Request Serving Nodes Need Upsizing
              expr: count(sre:node_request_serving:excessive_consumption_cpu or sre:node_request_serving:excessive_consumption_memory) by (request_node, _mc_id) unless on (_id) hypershift_cluster_alerts_disabled
              for: 1h
              labels:
                severity: critical
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: oauth-service-health
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: OauthServiceRules
          interval: 30s
          rules:
            - alert: OauthServiceDeploymentDegraded
              annotations:
                description: An Oauth Service deployment does not have the expected number of replicas.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/hypershift/OauthServiceDeploymentDegraded.md
                summary: An Oauth Service deployment does not have the expected number of available replicas.
              expr: |
                (sre:oauth:deployment_pods_unavailable > 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 10m
              labels:
                severity: warning
                otel_collect: "true"
            - alert: OauthServiceDeploymentDown
              annotations:
                description: There are no ready Oauth Service pods in the HCP Namespace.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/hypershift/OauthServiceDeploymentDown.md
                summary: There are no ready Oauth Service pods in the HCP Namespace.
              labels:
                severity: warning
                otel_collect: "true"
              expr: (sre:sre:oauth:pod_status_ready == 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 15m
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: watchdog
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: watchdog
          interval: 30s
          rules:
            - alert: HCPWatchdogDown
              annotations:
                summary: No `watchdog` heartbeat for {{ $labels._id }} detected
                description: No `watchdog` heartbeat for {{ $labels._id }} detected. This means the alerting stack is not functioning properly and alerts may not fire.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/HCPWatchdogDown.md
              expr: sum by (_id, _mc_id, region, sector) (vector(1)) unless on (_id) (watchdog or hypershift_cluster_alerts_disabled)
              for: 15m
              labels:
                severity: critical
            - record: watchdog
              expr: vector(1)
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sre-prometheus-target-alerting
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sre-prometheus-target-alerting
          interval: 1m
          rules:
            - alert: HCPPrometheusPodMonitorDown
              expr: (sre:hcp_podmonitor_up:sum{name!~"karpenter"} == 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 30m
              labels:
                severity: critical
              annotations:
                summary: PodMonitor {{ $labels.name }} in namespace {{ $labels.namespace }} is down.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/HCPPrometheusPodMonitorDown.md
                description: PodMonitor {{ $labels.name }} in namespace {{ $labels.namespace }} has been down for 30m.
            - alert: HCPPrometheusServiceMonitorDown
              expr: (sre:hcp_servicemonitor_up:sum{name!~"node-tuning-operator|ovnkube-control-plane|cluster-version-operator|olm-operator-metrics|catalog-operator-metrics"} == 0) unless on (_id) (hypershift_cluster_waiting_initial_avaibility_duration_seconds or hypershift_cluster_alerts_disabled)
              for: 30m
              labels:
                severity: critical
              annotations:
                summary: ServiceMonitor {{ $labels.name }} in namespace {{ $labels.namespace }} is down.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/HCPPrometheusServiceMonitorDown.md
                description: ServiceMonitor {{ $labels.name }} in namespace {{ $labels.namespace }} has been down for 30m.
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: cluster-operators
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: cluster-operators
          interval: 60s
          rules:
            - alert: ClusterOperatorDegraded
              annotations:
                summary: Cluster operator is in degraded state.
                description: The {{ $labels.name }} operator is reporting a degraded state for {{ $labels._id }}.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/ClusterOperatorDegraded.md
              expr: (cluster_operator_conditions{condition="Degraded",_id!=""} == 1) unless on (_id) (hypershift_cluster_waiting_initial_avaibility_duration_seconds or hypershift_cluster_alerts_disabled)
              for: 60m
              labels:
                severity: warning
                otel_collect: "true"
            - alert: ClusterOperatorDown
              annotations:
                summary: Cluster operator is unavailable.
                description: The {{ $labels.name }} operator is unavailable for {{ $labels._id }}.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/ClusterOperatorDown.md
              expr: (cluster_operator_conditions{condition="Available",_id!=""} == 0) unless on (_id) (hypershift_cluster_waiting_initial_avaibility_duration_seconds or hypershift_cluster_alerts_disabled)
              for: 60m
              labels:
                severity: critical
                otel_collect: "true"
        - name: core-cluster-operators
          interval: 60s
          rules:
            - record: hcp_worker_nodes:available_count
              expr: |
                label_replace(
                  count by (exported_namespace, _id)(capi_machine_info{node_healthy="True", ready="True"}),
                  "namespace",
                  "$1",
                  "exported_namespace",
                  "(.*)")
            - record: core_cluster_operator:down:filtered
              expr: |
                max by (_id, namespace, name, reason) (
                  cluster_operator_up{name=~"monitoring|network|console|dns|insights|service-ca|kube-storage-version-migrator|image-registry|storage"} == 0
                )
                and on (namespace) (hcp_worker_nodes:available_count >= 2)
                unless on (_id) hypershift_cluster_alerts_disabled
            - alert: CoreClusterOperatorDown
              annotations:
                summary: Core cluster operator {{ $labels.name }} has been down for 15 minutes.
                description: The {{ $labels.name }} operator has been down for 15 minutes, and the components it manages may be unavailable or degraded.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/CoreCriticalClusterOperatorDown.md
              expr: core_cluster_operator:down:filtered{name=~"console|network|monitoring|dns"}
              for: 15m
              labels:
                severity: warning
                otel_collect: "true"
            - alert: DefaultIngressControllerDegraded
              annotations:
                summary: The default IngressController has been degraded for 30 minutes.
                description: The default IngressController is degraded for {{ $labels._id }}. Ingress traffic may be impacted.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/DefaultIngressControllerDegraded.md
              expr: (max by (_id, condition, name, namespace) (ingress_controller_conditions{name="default", condition="Degraded"} == 1)) unless on (_id) hypershift_cluster_alerts_disabled
              for: 30m
              labels:
                severity: warning
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sre-etcd-rules
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: sre-etcd-rules
          interval: 30s
          rules:
            - alert: etcdNoLeader
              annotations:
                summary: etcd cluster has no leader
                description: 'etcd cluster "{{ $labels.job }}": member {{ $labels.instance }} has no leader.'
                runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdNoLeader.md
              expr: (etcd_server_has_leader{job=~".*etcd.*", _id!=""} == 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 1m
              labels:
                severity: critical
            - alert: etcdHighNumberOfLeaderChanges
              annotations:
                summary: etcd cluster has high number of leader changes.
                description: 'etcd cluster "{{ $labels.job }}": {{ $value }} average leader changes within the last 10 minutes. Frequent elections may be a sign of insufficient resources, high network latency, or disruptions by other components and should be investigated.'
              expr: (avg by (_id, _mc_id) (changes(etcd_server_is_leader{_id!=""}[10m])) > 5) unless on (_id) hypershift_cluster_alerts_disabled
              for: 5m
              labels:
                severity: warning
            - alert: etcdDatabaseQuotaLowSpace
              annotations:
                description: 'etcd cluster for "{{ $labels._id }}": database size is 65% of the defined quota on etcd instance {{ $labels.instance }}, please defrag or increase the quota as the writes to etcd will be disabled when it is full.'
                summary: etcd cluster database is using >= 65% of the defined quota.
              expr: |
                (
                  (
                      max by (_id, _mc_id) (last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m]))
                    /
                      max by (_id, _mc_id) (last_over_time(etcd_server_quota_backend_bytes{job=~".*etcd.*"}[5m]))
                  )
                  * 100 > 65
                ) unless on (_id) hypershift_cluster_alerts_disabled
              for: 10m
              labels:
                severity: info
            - alert: etcdDatabaseQuotaLowSpace
              annotations:
                description: 'etcd cluster for "{{ $labels._id }}": database size is 75% of the defined quota on etcd instance {{ $labels.instance }}, please defrag or increase the quota as the writes to etcd will be disabled when it is full.'
                summary: etcd cluster database is using >= 75% of the defined quota.
              expr: |
                (
                  (
                      max by (_id, _mc_id) (last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m]))
                    /
                      max by (_id, _mc_id) (last_over_time(etcd_server_quota_backend_bytes{job=~".*etcd.*"}[5m]))
                  )
                  * 100 > 75
                ) unless on (_id) hypershift_cluster_alerts_disabled
              for: 10m
              labels:
                severity: warning
            - alert: etcdDatabaseQuotaLowSpace
              annotations:
                description: 'etcd cluster for "{{ $labels._id }}": database size is 85% of the defined quota on etcd instance {{ $labels.instance }}, please defrag or increase the quota as the writes to etcd will be disabled when it is full.'
                runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdDatabaseQuotaLowSpace.md
                summary: etcd cluster database is running full.
              expr: |
                (
                  (
                      max by (_id, _mc_id) (last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m]))
                    /
                      max by (_id, _mc_id) (last_over_time(etcd_server_quota_backend_bytes{job=~".*etcd.*"}[5m]))
                  )
                  * 100 > 85
                ) unless on (_id) hypershift_cluster_alerts_disabled
              for: 10m
              labels:
                severity: critical
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: kube-controller-manager
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: osd-kube-controller-manager
          interval: 1m
          rules:
            - record: sre:kube_controller_manager:pod_status_ready
              expr: sum by (_id, _mc_id) (kube_pod_status_ready{pod=~"kube-controller-manager.*", namespace=~"ocm-.*-.*", condition="true"})
            - alert: KubeControllerManagerDown
              annotations:
                description: There are 0 Ready 'kube-controller-manager' Pods for {{ $labels.namespace }}.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/KubeControllerManagerDown.md
                summary: No Ready kube-controller-manager pods.
              labels:
                severity: critical
              expr: (sre:kube_controller_manager:pod_status_ready == 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 15m
            - alert: KubeControllerManagerDegraded
              annotations:
                description: There is not at least 2 Ready 'kube-controller-manager' Pods for {{ $labels.namespace }}.
