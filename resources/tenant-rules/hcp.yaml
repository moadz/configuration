                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[2h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[2h])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[2h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[2h])), "type", "slow-namespace", "_none_", "")
                or
