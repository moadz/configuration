                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[6h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[6h])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[6h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[6h])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_5m
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[5m])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[5m])), "type", "slow", "_none_", "")
            - record: apiserver_request:error_rate_30m
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[30m])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[30m])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[30m])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[30m])), "type", "slow", "_none_", "")
            - record: apiserver_request:error_rate_1h
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[1h])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[1h])), "type", "slow", "_none_", "")
            - record: apiserver_request:error_rate_2h
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[2h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[2h])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[2h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[2h])), "type", "slow", "_none_", "")
            - record: apiserver_request:error_rate_6h
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[6h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[6h])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[6h])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[6h])), "type", "slow", "_none_", "")
            - alert: KubeAPIErrorBudgetBurn
              annotations:
                description: The API server is burning too much error budget. Too many requests are failing with high latency.
                runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-kube-apiserver-operator/KubeAPIErrorBudgetBurn.md
                summary: High error budget burn for Kube API server
              labels:
                long: 1h
                short: 5m
                severity: warning
                otel_collect: "true"
              expr: |
                max_over_time(count by (_id, job, namespace,type,verb)(apiserver_request:error_rate_1h > (14.40 * 0.0001) and apiserver_request:error_rate_5m > (14.40 * 0.0001))[5m:])
              for: 2m
            - alert: KubeAPIErrorBudgetBurn
              annotations:
                description: The API server is burning too much error budget. Too many requests are failing with high latency.
                runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-kube-apiserver-operator/KubeAPIErrorBudgetBurn.md
                summary: High error budget burn for Kube API server
              labels:
                long: 6h
                short: 30m
                severity: warning
                otel_collect: "true"
              expr: |
                max_over_time(count by (_id, job, namespace,type,verb)(apiserver_request:error_rate_6h > (6.00 * 0.0001) and apiserver_request:error_rate_30m > (6.00 * 0.0001))[10m:])
              for: 15m
        - name: KubeAPIErrorBudgetBurn_15m_eval
          interval: 15m
          rules:
            - record: apiserver_request:error_rate_1d
              labels:
                verb: read
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1d])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1d])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1d])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1d])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_3d
              labels:
                verb: read
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[3d])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[3d])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[3d])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[3d])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_1d
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[1d])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[1d])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[1d])), "type", "slow", "_none_", "")
            - record: apiserver_request:error_rate_3d
              labels:
                verb: write
                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:errors_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[3d])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:write:slow_count[3d])) / sum by (job, _id, namespace) (delta(apiserver_request:write:total_count[3d])), "type", "slow", "_none_", "")
            - alert: KubeAPIErrorBudgetBurn
              annotations:
                description: The API server is burning too much error budget. Too many requests are failing with high latency.
                runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-kube-apiserver-operator/KubeAPIErrorBudgetBurn.md
                summary: High error budget burn for Kube API server
              labels:
                long: 1d
                short: 2h
                severity: warning
                otel_collect: "true"
              expr: |
                apiserver_request:error_rate_1d > (3.00 * 0.0001)
                and
                apiserver_request:error_rate_2h > (3.00 * 0.0001)
              for: 15m
            - alert: KubeAPIErrorBudgetBurn
              annotations:
                description: The API server is burning too much error budget. Too many requests are failing with high latency.
                runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-kube-apiserver-operator/KubeAPIErrorBudgetBurn.md
                summary: High error budget burn for Kube API server
              labels:
                long: 3d
                short: 6h
                severity: warning
                otel_collect: "true"
              expr: |
                apiserver_request:error_rate_3d > (1.00 * 0.0001)
                and
                apiserver_request:error_rate_6h > (1.00 * 0.0001)
              for: 15m
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: sae-deployment
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: SAEDeploymentErrors
          interval: 60s
          rules:
            - alert: SAEDeploymentMissing
              annotations:
                description: The SAE deployment is missing for {{ $labels.namespace }}. Splunk audit log forwarding is not functional.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/SAEDeploymentMissing.md
                summary: SAE deployment missing
              expr: |
                (
                  (sum by (_id, _mc_id, namespace, region, sector) (kube_deployment_labels{namespace=~"ocm-.*-.*", deployment="splunk-audit-exporter"}))
                  unless on (_id, _mc_id, namespace)
                  (sum by (_id, _mc_id, namespace, region, sector) (kube_deployment_status_replicas_available{namespace=~"ocm-.*-.*", deployment="splunk-audit-exporter"} > 0))
                ) unless on (_id) hypershift_cluster_alerts_disabled
              for: 15m
              labels:
                severity: warning
                otel_collect: "true"
            - alert: SAEDeploymentDown
              annotations:
                description: The SAE deployment for {{ $labels.namespace }} has 0 available replicas. Splunk audit log forwarding is not functional.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/SAEDeploymentDown.md
                summary: SAE deployment down
              expr: (kube_deployment_status_replicas_available{namespace=~"ocm-.*-.*", deployment="splunk-audit-exporter"} == 0) unless on (_id) hypershift_cluster_alerts_disabled
              for: 15m
              labels:
                severity: critical
                otel_collect: "true"
            - alert: SAEDeploymentDoesNotHaveExpectedReplicas
              annotations:
                description: Splunk Audit Exporter does not have expected number of replicas for {{ $labels.namespace }}.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/hypershift/SAEDeploymentDoesNotHaveExpectedReplicas.md
                summary: SAE deployment does not have expected replicas
              expr: |
                (
                  count by (namespace, deployment, _id) (
                    sum by(namespace, deployment, _id) (
                      kube_deployment_status_replicas_available{namespace=~"ocm-.*", deployment="audit-webhook"}
                    )
                    <
                    sum by(namespace, deployment, _id) (
                      kube_deployment_spec_replicas{namespace=~"ocm-.*", deployment="audit-webhook"}
                    )
                  ) >= 1
                ) unless on (_id) hypershift_cluster_alerts_disabled
              for: 10m
              labels:
                severity: warning
                otel_collect: "true"
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: rhobs-synthetics-rmo
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: rhobs-synthetics-rmo
          interval: 1m
          rules:
            - alert: RMOAPIRequestErrorRate
              expr: |
                (
                  rate(rhobs_route_monitor_operator_api_requests_total{status="error"}[10m])
                  /
                  rate(rhobs_route_monitor_operator_api_requests_total[10m])
                ) > 0.5
              for: 15m
              labels:
                severity: warning
                service: rhobs-synthetics
              annotations:
                summary: RMO on {{ $labels.mc_name }} has high RHOBS API error rate
                description: Route-monitor-operator on MC {{ $labels.mc_name }} ({{ $labels.region }}) has >50% API request error rate for 15 minutes.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/RMOAPIRequestErrorRate.md
            - alert: RMOOIDCTokenRefreshFailures
              expr: |
                rate(rhobs_route_monitor_operator_oidc_token_refresh_total{status="error"}[10m]) > 0
                unless
                rate(rhobs_route_monitor_operator_oidc_token_refresh_total{status="success"}[10m]) > 0
              for: 15m
              labels:
                severity: warning
                service: rhobs-synthetics
              annotations:
                summary: RMO on {{ $labels.mc_name }} cannot refresh OIDC tokens
                description: Route-monitor-operator on MC {{ $labels.mc_name }} ({{ $labels.region }}) has had no successful OIDC token refreshes for 15 minutes. Probe lifecycle operations will fail.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/RMOOIDCTokenRefreshFailures.md
            - alert: RMOProbeDeletionTimeout
              expr: increase(rhobs_route_monitor_operator_probe_deletion_timeout_total[1h]) > 0
              labels:
                severity: warning
                service: rhobs-synthetics
              annotations:
                summary: RMO on {{ $labels.mc_name }} had probe deletion timeouts
                description: Route-monitor-operator on MC {{ $labels.mc_name }} ({{ $labels.region }}) triggered fail-open behavior during probe deletion. Orphaned probes may exist and require manual cleanup.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/RMOProbeDeletionTimeout.md
            - alert: RMOMetricsAbsent
              expr: |
                (absent(rhobs_route_monitor_operator_info) == 1)
                unless
                (absent_over_time(rhobs_route_monitor_operator_info[1h]) == 1)
              for: 30m
              labels:
                severity: critical
                service: rhobs-synthetics
              annotations:
                summary: RMO metrics are absent from all MCs
                description: No route-monitor-operator metrics have been received from any MC for 30 minutes, but metrics were present within the last hour. The RMO may have stopped running or MC metric collection may be broken.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/RMOMetricsAbsent.md
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: rhobs-synthetics-api
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: rhobs-synthetics-api
          interval: 1m
          rules:
            - alert: SyntheticsAPIDown
              expr: up{job="synthetics-api"} == 0
              for: 5m
              labels:
                severity: critical
                service: rhobs-synthetics
              annotations:
                summary: Synthetics API is down
                description: The synthetics-api service has been unreachable for 5 minutes. Probe lifecycle management is unavailable.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/SyntheticsAPIDown.md
            - alert: SyntheticsAPIHighErrorRate
              expr: |
                (
                  rate(rhobs_synthetics_api_probestore_errors_total[5m])
                  /
                  rate(rhobs_synthetics_api_http_requests_total[5m])
                ) > 0.1
              for: 10m
              labels:
                severity: warning
                service: rhobs-synthetics
              annotations:
                summary: Synthetics API has high probestore error rate
                description: The synthetics-api has >10% probestore error rate for 10 minutes.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/SyntheticsAPIHighErrorRate.md
            - alert: SyntheticsAPIHighLatency
              expr: |
                histogram_quantile(0.99, rate(rhobs_synthetics_api_http_request_duration_seconds_bucket[5m])) > 5
              for: 10m
              labels:
                severity: warning
                service: rhobs-synthetics
              annotations:
                summary: Synthetics API has high request latency
                description: The synthetics-api p99 request latency has been above 5 seconds for 10 minutes.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/SyntheticsAPIHighLatency.md
            - alert: SyntheticsAPIMetricsAbsent
              expr: absent(up{job="synthetics-api"})
              for: 10m
              labels:
                severity: critical
                service: rhobs-synthetics
              annotations:
                summary: Synthetics API metrics are absent
                description: No metrics are being received from the synthetics-api. The service may be completely down or its metrics endpoint may be unreachable.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/SyntheticsAPIMetricsAbsent.md
  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: rhobs-synthetics-agent
      namespace: ${NAMESPACE}
      labels:
        operator.thanos.io/prometheus-rule: "true"
        operator.thanos.io/tenant: ${TENANT}
    spec:
      groups:
        - name: rhobs-synthetics-agent
          interval: 1m
          rules:
            - alert: SyntheticsAgentDown
              expr: up{job="synthetics-agent"} == 0
              for: 5m
              labels:
                severity: critical
                service: rhobs-synthetics
              annotations:
                summary: Synthetics Agent is down
                description: The synthetics-agent has been unreachable for 5 minutes. Probe reconciliation is not running.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/SyntheticsAgentDown.md
            - alert: SyntheticsAgentReconcileFailures
              expr: |
                (
                  rate(rhobs_synthetics_agent_reconciliation_total{status="error"}[10m])
                  /
                  rate(rhobs_synthetics_agent_reconciliation_total[10m])
                ) > 0.5
              for: 15m
              labels:
                severity: warning
                service: rhobs-synthetics
              annotations:
                summary: Synthetics Agent has high reconciliation failure rate
                description: The synthetics-agent has >50% reconciliation failure rate for 15 minutes. Probe CRs may not be getting created or updated.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/SyntheticsAgentReconcileFailures.md
            - alert: SyntheticsAgentFetchFailures
              expr: |
                rate(rhobs_synthetics_agent_probe_list_fetch_total{status="error"}[10m]) > 0
                unless
                rate(rhobs_synthetics_agent_probe_list_fetch_total{status="success"}[10m]) > 0
              for: 10m
              labels:
                severity: critical
                service: rhobs-synthetics
              annotations:
                summary: Synthetics Agent cannot fetch probe list from API
                description: The synthetics-agent has had no successful API fetches for 10 minutes. New probes will not be created and existing probes will not be reconciled.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/SyntheticsAgentFetchFailures.md
            - alert: SyntheticsAgentNoProbesManaged
              expr: rhobs_synthetics_agent_probe_resources_managed == 0
              for: 30m
              labels:
                severity: warning
                service: rhobs-synthetics
              annotations:
                summary: Synthetics Agent is managing zero probes
                description: The synthetics-agent has been managing zero probe CRs for 30 minutes. This may indicate a configuration issue or API connectivity problem.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/SyntheticsAgentNoProbesManaged.md
            - alert: SyntheticsAgentReconcileStale
              expr: |
                (time() - rhobs_synthetics_agent_last_reconciliation_timestamp_seconds) > 300
              for: 2m
              labels:
                severity: critical
                service: rhobs-synthetics
              annotations:
                summary: Synthetics Agent reconciliation is stale
                description: The synthetics-agent has not completed a reconciliation cycle in over 5 minutes (it normally runs every 30 seconds). The agent may be hung or crashed without the process exiting.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/SyntheticsAgentReconcileStale.md
            - alert: SyntheticsAgentMetricsAbsent
              expr: absent(up{job="synthetics-agent"})
              for: 10m
              labels:
                severity: critical
                service: rhobs-synthetics
              annotations:
                summary: Synthetics Agent metrics are absent
                description: No metrics are being received from the synthetics-agent. The service may be completely down or its metrics endpoint may be unreachable.
                runbook_url: https://github.com/openshift/ops-sop/blob/master/hypershift/alerts/rhobs-synthetics/SyntheticsAgentMetricsAbsent.md
