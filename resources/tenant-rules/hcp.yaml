                otel_collect: "true"
              expr: |
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:errors_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1h])), "type", "error", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_resource_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1h])), "type", "slow-resource", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_namespace_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1h])), "type", "slow-namespace", "_none_", "")
                or
                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[1h])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[1h])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_2h
