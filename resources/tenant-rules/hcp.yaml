      groups:
        - name: api-rapid-burn
          interval: 30s
          rules:
            - alert: api-RapidErrorBudgetBurn
              annotations:
                message: Rapid error budget burn detected for openshift api (>90% failure rate)
                runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/hypershift/api-ErrorBudgetBurn.md
              expr: |-
                label_replace(
                        label_replace(
                            label_replace((
                1-(sum by (probe_url, apiserver_url, mc_name, _mc_id, sector, region, _id)((sum_over_time(probe_success{probe_url=~".*api.*"}[3m]) or sum_over_time(probe_success{apiserver_url=~".*api.*"}[3m])))/ sum by (probe_url, apiserver_url, mc_name, _mc_id, sector, region, _id)((count_over_time(probe_success{probe_url=~".*api.*"}[3m]) or count_over_time(probe_success{apiserver_url=~".*api.*"}[3m]))))> 0.90 and sum by (probe_url, apiserver_url, mc_name, _mc_id, sector, region, _id)((count_over_time(probe_success{probe_url=~".*api.*"}[3m]) or count_over_time(probe_success{apiserver_url=~".*api.*"}[3m]))) > 3
                            ), "_id_or_ns", "ocm-$1-$2", "namespace", "ocm-([^-]*)-([^-]*).*"),
                        "_id_or_ns", "$0", "_id", ".+")
                    unless on (_id_or_ns) (
                        label_replace(hypershift_cluster_alerts_disabled, "_id_or_ns", "$0", "_id", ".*")
                        or
