                label_replace(sum by (job, _id, namespace) (delta(apiserver_request:read:slow_cluster_count[5m])) / sum by (job, _id, namespace) (delta(apiserver_request:read:total_count[5m])), "type", "slow-cluster", "_none_", "")
            - record: apiserver_request:error_rate_30m
              labels:
