apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhobs-ocm-monitoring-stack
  annotations:
    description: "Template for deploying RHOBS MonitoringStack for OCM component metrics collection on app-sre OSD clusters"
parameters:
  - name: NAMESPACE
    description: Namespace to deploy the MonitoringStack
    value: openshift-observability-operator
  - name: CLIENT_ID
    description: "OIDC client ID"
    required: true
  - name: CLIENT_SECRET
    description: "OIDC client secret"
    required: true
  - name: RHOBS_URL
    description: "RHOBS cell base URL"
    required: true
  - name: RHOBS_SECRET_NAME
    value: rhobs-ocm-credential
  - name: RHOBS_ENV
    description: "Environment label (stage/production)"
    value: stage
  - name: CLUSTER_NAME
    description: "Name of the OSD cluster"
    required: true
  - name: TENANT
    description: "RHOBS tenant ID"
    value: EFD08939-FE1D-41A1-A28A-BE9A9BC68003
  - name: OPENSHIFT_MONITORING_NAMESPACE
    value: openshift-monitoring

objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${RHOBS_SECRET_NAME}
      namespace: ${NAMESPACE}
    type: Opaque
    stringData:
      client-id: "${CLIENT_ID}"
      client-secret: "${CLIENT_SECRET}"

  # MonitoringStack for OCM component metrics collection
  - apiVersion: monitoring.rhobs/v1alpha1
    kind: MonitoringStack
    metadata:
      name: rhobs-ocm-monitoring-stack
      namespace: ${NAMESPACE}
    spec:
      resourceSelector: {}
      namespaceSelector: {}
      replicas: 1
      logLevel: info
      retention: 2h
      alertmanagerConfig:
        disabled: true
      prometheusConfig:
        scrapeInterval: 60s
        externalLabels:
          cluster_name: ${CLUSTER_NAME}
          env: ${RHOBS_ENV}
          source: OCM
        remoteWrite:
          - name: RHOBS
            url: ${RHOBS_URL}/api/metrics/v1/${TENANT}/api/v1/receive
            oauth2:
              clientId:
                secret:
                  key: client-id
                  name: ${RHOBS_SECRET_NAME}
              clientSecret:
                key: client-secret
                name: ${RHOBS_SECRET_NAME}
              scopes:
                - profile
              tokenUrl: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
            queueConfig:
              capacity: 2500
              maxShards: 200
              minShards: 1
              maxSamplesPerSend: 2000
              batchSendDeadline: 60s
              minBackoff: 30ms
              maxBackoff: 256s
            metadataConfig:
              send: false
            writeRelabelConfigs:
              # Only allow metrics from OCM namespaces (uhc-*, osd-fleet-manager-*)
              - action: Replace
                sourceLabels: [__name__, namespace]
                regex: "(.+);(uhc-.*|osd-fleet-manager-.*)"
                replacement: "true"
                targetLabel: __tmp_allowed
              # Allow scrape target health metrics
              - action: Replace
                sourceLabels: [__name__]
                regex: "(up|scrape_samples_scraped|scrape_duration_seconds)"
                replacement: "true"
                targetLabel: __tmp_allowed
              # Keep only allowed metrics
              - action: Keep
                regex: "true"
                sourceLabels: [__tmp_allowed]
              # Add source label
              - action: Replace
                regex: $^
                replacement: OCM
                sourceLabels: [source]
                targetLabel: source
              # Drop temporary labels
              - action: LabelDrop
                regex: "__tmp.*"
      resources:
        requests:
          cpu: 500m
          memory: 1Gi

  # Federation ServiceMonitor to collect OCM namespace metrics from CMO Prometheus
  # Deployed in ${NAMESPACE} with namespaceSelector to target openshift-monitoring
  # NOTE: ClusterRoleBinding for cluster-monitoring-view must be deployed separately
  # (e.g., via namespace openshiftResources) since saas-deploy should not create
  # cluster-scoped resources.
  - apiVersion: monitoring.rhobs/v1
    kind: ServiceMonitor
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
      name: ocm-cmo-federate
      namespace: ${NAMESPACE}
    spec:
      namespaceSelector:
        matchNames:
          - ${OPENSHIFT_MONITORING_NAMESPACE}
      selector:
        matchLabels:
          app.kubernetes.io/component: prometheus
          app.kubernetes.io/instance: k8s
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/part-of: openshift-monitoring
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          honorLabels: true
          interval: 60s
          scrapeTimeout: 60s
          metricRelabelings:
            - regex: prometheus_replica|prometheus
              action: LabelDrop
          relabelings:
            - targetLabel: source
              replacement: OCM
            - targetLabel: __address__
              replacement: prometheus-k8s.openshift-monitoring.svc:9091
            - action: LabelDrop
              regex: pod|namespace|service|endpoint|container
          port: web
          scheme: https
          path: "/federate"
          params:
            'match[]':
              - "{__name__=~\"\
              container_cpu_usage_seconds_total|\
              container_memory_working_set_bytes|\
              container_memory_rss|\
              kube_deployment_spec_replicas|\
              kube_deployment_status_replicas_available|\
              kube_deployment_status_replicas_ready|\
              kube_deployment_status_replicas_unavailable|\
              kube_deployment_status_replicas_updated|\
              kube_pod_info|\
              kube_pod_status_ready|\
              kube_pod_status_reason|\
              kube_pod_container_status_restarts_total|\
              kube_pod_start_time|\
              kube_pod_resource_request|\
              kube_pod_resource_limit|\
              kube_running_pod_ready|\
              up\",namespace=~\"uhc-.*|osd-fleet-manager-.*\"}"
          tlsConfig:
            ca:
              configMap:
                key: service-ca.crt
                name: serving-certs-ca-bundle
            cert:
              secret:
                key: tls.crt
                name: metrics-client-certs
            keySecret:
              key: tls.key
              name: metrics-client-certs
            serverName: prometheus-k8s.openshift-monitoring.svc
